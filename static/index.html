
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="媒体浏览器">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=media%20gallery%20app%20icon%20with%20camera%20and%20images&image_size=square">
    <title>媒体浏览器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #fff; overflow-x: hidden; }
        .install-banner {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 20px;
            z-index: 9999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .install-banner.show { display: flex; align-items: center; justify-content: space-between; }
        .install-banner-content { display: flex; align-items: center; gap: 15px; }
        .install-icon { font-size: 36px; }
        .install-text h3 { font-size: 16px; font-weight: 600; }
        .install-text p { font-size: 13px; opacity: 0.9; }
        .install-btn {
            padding: 10px 20px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .install-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .container { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; padding-top: 70px; }
        h1 { font-size: 40px; font-weight: 700; }
        .filter-btns { display: flex; gap: 10px; }
        .filter-btn {
            padding: 10px 24px;
            background: #333;
            border: none;
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { background: #444; color: #fff; }
        .filter-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .action-btns { display: flex; gap: 10px; margin-left: auto; }
        .action-btn { 
            padding: 10px 20px; 
            background: #333; 
            border: none; 
            color: #888; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            transition: all 0.2s ease; 
        }
        .action-btn:hover { background: #444; color: #fff; }
        .action-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        
        /* 右上角选择按钮 */
        #selectModeBtn { 
            position: fixed; 
            top: 15px; 
            right: 15px; 
            z-index: 1000;
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
            font-size: 14px;
        }
        #selectModeBtn:hover { transform: scale(1.05); }
        
        /* 右下角删除按钮 */
        #deleteBtn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            z-index: 1000; 
            background: linear-gradient(135deg, #e74c3c, #c0392b); 
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(231,76,60,0.4);
            font-size: 14px;
        }
        #deleteBtn:hover { transform: scale(1.05); }
        .date-section { margin-bottom: 30px; }
        .date-header { font-size: 18px; font-weight: 600; padding: 12px 0; color: #888; display: flex; align-items: center; gap: 10px; }
        .photo-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; }
        .photo-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; background: #1a1a1a; position: relative; user-select: none; transition: transform 0.1s ease; }
        .photo-item:active { transform: scale(0.95); }
        .photo-item.long-press { transform: scale(0.9); opacity: 0.7; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; image-rendering: -webkit-optimize-contrast; }
        .photo-item.selected { outline: 3px solid #667eea; z-index: 10; }
        .photo-item.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 20;
        }
        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .play-indicator {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #111;
        }
        .play-indicator::before { content: '▶'; margin-left: 3px; }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .lightbox.active { display: flex; }
        .lightbox-content { position: relative; width: 95vw; height: 90vh; display: flex; align-items: center; justify-content: center; background: #000; }
        .lightbox-content img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
        .lightbox-content video { width: 100%; height: 100%; object-fit: contain; }
        .lightbox-content img.zoomed { cursor: zoom-out; }
        .video-error { text-align: center; color: #888; padding: 20px; }
        .video-error button { margin-top: 10px; padding: 10px 20px; background: #333; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
        .lightbox-close { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; cursor: pointer; transition: all 0.2s; z-index: 1010; }
        .lightbox-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
        .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 76px; height: 76px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; cursor: pointer; transition: background 0.2s; z-index: 1010; }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }
        .lightbox-counter { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; z-index: 1010; }
        .lightbox-delete { 
            position: fixed; 
            top: 20px; 
            right: 80px; 
            width: 50px; 
            height: 50px; 
            background: rgba(231,76,60,0.8); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            z-index: 1010;
            box-shadow: 0 4px 12px rgba(231,76,60,0.4);
        }
        .lightbox-delete:hover { 
            background: rgba(231,76,60,1); 
            transform: scale(1.1); 
        }
        .close-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 14px; white-space: nowrap; z-index: 1010; }

        .select-hint { background: rgba(102,126,234,0.2); padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        .zoom-hint { background: rgba(102,126,234,0.2); padding: 8px 16px; border-radius: 20px; font-size: 14px; margin-left: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 1400px) { .photo-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (max-width: 1200px) { .photo-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 900px) { .photo-grid { grid-template-columns: repeat(5, 1fr); } .play-indicator { width: 32px; height: 32px; } }
        @media (max-width: 600px) { 
            .photo-grid { grid-template-columns: repeat(4, 1fr); } 
            .filter-btn { padding: 8px 16px; font-size: 14px; } 
            .action-btn { padding: 8px 16px; font-size: 14px; }
            .play-indicator { width: 28px; height: 28px; font-size: 14px; } 
            .lightbox-close { width: 45px; height: 45px; font-size: 26px; top: 15px; right: 15px; }
            .lightbox-nav { width: 58px; height: 58px; font-size: 32px; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            h1 { font-size: 28px; }
            .container { padding: 15px; }
            .header { gap: 10px; }
        }
        /* ========= Skeleton ========= */
        .skeleton-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; padding: 20px 0; }
        .skeleton-item { aspect-ratio: 1; background: #1a1a1a; position: relative; overflow: hidden; }
        .skeleton-item::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { to { left: 100%; } }
        .skeleton-header { height: 24px; width: 180px; background: #222; border-radius: 6px; margin: 20px 0 12px 0; position: relative; overflow: hidden; }
        .skeleton-header::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        /* ========= Status ========= */
        .status-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; color: #666; }
        .status-state.visible { display: flex; }
        .status-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .status-title { font-size: 20px; font-weight: 600; color: #888; margin-bottom: 8px; }
        .status-desc { font-size: 14px; color: #555; margin-bottom: 24px; max-width: 400px; line-height: 1.5; }
        .status-btn { padding: 10px 28px; background: #333; border: none; color: #aaa; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .status-btn:hover { background: #444; color: #fff; }
        /* ========= Dialog ========= */
        .dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 99999; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .dialog-overlay.active { display: flex; }
        .dialog-box { background: #1e1e1e; border-radius: 16px; padding: 28px; max-width: 420px; width: 88vw; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: dialogIn 0.2s ease; }
        @keyframes dialogIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .dialog-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .dialog-title .dlg-icon { font-size: 22px; }
        .dialog-body { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 24px; }
        .dialog-body .dlg-path { color: #666; font-size: 12px; word-break: break-all; margin-top: 8px; padding: 8px 12px; background: #111; border-radius: 8px; }
        .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .dialog-actions button { padding: 10px 24px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .dialog-btn-cancel { background: #333; color: #888; }
        .dialog-btn-cancel:hover { background: #444; color: #fff; }
        .dialog-btn-confirm { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .dialog-btn-confirm:hover { filter: brightness(1.15); }
        .dialog-btn-confirm.danger { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .dialog-btn-confirm.danger:hover { filter: brightness(1.15); }
        /* ========= Pan ========= */
        .lightbox-content img.grabbing { cursor: grabbing; }
        /* ========= Toast ========= */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 99998; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .toast { padding: 12px 24px; background: #333; color: #fff; border-radius: 12px; font-size: 14px; font-weight: 500; animation: toastIn 0.25s ease, toastOut 0.25s ease 2.5s forwards; pointer-events: auto; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
        @media (max-width: 1400px) { .skeleton-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (max-width: 1200px) { .skeleton-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 900px) { .skeleton-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 600px) { .skeleton-grid { grid-template-columns: repeat(4, 1fr); } }
    </style></head>
<body>
    <div class="install-banner" id="installBanner">
        <div class="install-banner-content">
            <div class="install-icon">📸</div>
            <div class="install-text">
                <h3>安装到主屏幕</h3>
                <p>像APP一样使用媒体浏览器</p>
            </div>
        </div>
        <button class="install-btn" id="installBtn">安装</button>
        <button class="install-close" id="installClose">×</button>
    </div>
    
    <button class="action-btn" id="selectModeBtn" style="position:fixed;top:20px;right:20px;z-index:1000;">选择</button>
    <div class="container" id="mainContainer" style="display:none;">
        <div class="header">
            <h1>📸 照片</h1>
            <div class="filter-btns">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="photo">照片</button>
                <button class="filter-btn" data-filter="video">视频</button>
            </div>
            <div class="action-btns">
                <button class="action-btn" id="selectAllBtn" style="display:none;">全选</button>
                <button class="action-btn delete" id="deleteBtn" style="display:none;">删除</button>
            </div>
        </div>
        <div id="skeletonArea">
            <div class="skeleton-header"></div>
            <div class="skeleton-grid" id="skeletonGrid"></div>
        </div>
        <div id="content"></div>
    </div>
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxCloseBtn">×</div>
        <div class="lightbox-nav prev" id="navPrev">‹</div>
        <div class="lightbox-content" id="lightboxContent"></div>
        <div class="lightbox-nav next" id="navNext">›</div>
        <div class="lightbox-counter" id="lightboxCounter"></div>
        <div class="lightbox-delete" id="lightboxDeleteBtn" title="删除此图片">🗑️</div>
        <div class="close-hint" id="lightboxHint">双指缩放 | 点击关闭 | 滑动翻页</div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog-box">
            <div class="dialog-title"><span class="dlg-icon" id="dialogIcon"></span><span id="dialogTitle"></span></div>
            <div class="dialog-body" id="dialogBody"></div>
            <div class="dialog-actions" id="dialogActions"></div>
        </div>
    </div>
    <div class="status-state" id="statusState">
        <div class="status-icon" id="statusIcon"></div>
        <div class="status-title" id="statusTitle"></div>
        <div class="status-desc" id="statusDesc"></div>
        <button class="status-btn" id="statusBtn"></button>
    </div>
    <script>
        // ==================== State ====================
        const state = {
            allMedia: [],
            filteredMedia: [],
            currentIndex: 0,
            currentFilter: 'all',
            selectMode: false,
            selectedFiles: new Set(),
            currentScale: 1,
            initialPinchScale: 1,
            translateX: 0,
            translateY: 0,
            isPanning: false,
            panStartX: 0,
            panStartY: 0,
            panStartTranslateX: 0,
            panStartTranslateY: 0,
            isZoomed: false
        };
        let deferredPrompt;

        // ==================== Toast ====================
        function showToast(msg, type) {
            const el = document.createElement('div');
            el.className = 'toast' + (type ? ' ' + type : '');
            el.textContent = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 2800);
        }

        // ==================== Dialog ====================
        function showConfirm(opts) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('dialogOverlay');
                document.getElementById('dialogIcon').textContent = opts.icon || '⚠️';
                document.getElementById('dialogTitle').textContent = opts.title || '确认';
                document.getElementById('dialogBody').innerHTML = (opts.message || '') +
                    (opts.path ? '<div class="dlg-path">' + opts.path + '</div>' : '');
                const actions = document.getElementById('dialogActions');
                actions.innerHTML = '';
                if (opts.cancelText !== null) {
                    const cancel = document.createElement('button');
                    cancel.className = 'dialog-btn-cancel';
                    cancel.textContent = opts.cancelText || '取消';
                    cancel.onclick = () => { overlay.classList.remove('active'); resolve(false); };
                    actions.appendChild(cancel);
                }
                const confirm = document.createElement('button');
                confirm.className = 'dialog-btn-confirm' + (opts.danger ? ' danger' : '');
                confirm.textContent = opts.confirmText || '确认';
                confirm.onclick = () => { overlay.classList.remove('active'); resolve(true); };
                actions.appendChild(confirm);
                overlay.classList.add('active');
                setTimeout(() => confirm.focus(), 100);
            });
        }

        function showAlert(opts) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('dialogOverlay');
                document.getElementById('dialogIcon').textContent = opts.icon || '✅';
                document.getElementById('dialogTitle').textContent = opts.title || '';
                document.getElementById('dialogBody').innerHTML = opts.message || '';
                const actions = document.getElementById('dialogActions');
                actions.innerHTML = '';
                const ok = document.createElement('button');
                ok.className = 'dialog-btn-confirm';
                ok.textContent = '知道了';
                ok.onclick = () => { overlay.classList.remove('active'); resolve(); };
                actions.appendChild(ok);
                overlay.classList.add('active');
                setTimeout(() => ok.focus(), 100);
            });
        }

        // ==================== Status ====================
        function showStatus(type, title, desc, btnText) {
            const el = document.getElementById('statusState');
            document.getElementById('statusIcon').textContent = type === 'empty' ? '📭' : type === 'error' ? '😵' : '';
            document.getElementById('statusTitle').textContent = title || '';
            document.getElementById('statusDesc').textContent = desc || '';
            const btn = document.getElementById('statusBtn');
            if (btnText) {
                btn.textContent = btnText;
                btn.style.display = '';
            } else {
                btn.style.display = 'none';
            }
            el.classList.add('visible');
        }

        function hideStatus() {
            document.getElementById('statusState').classList.remove('visible');
        }

        // ==================== Skeleton ====================
        function generateSkeleton() {
            const grid = document.getElementById('skeletonGrid');
            const count = 32;
            grid.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const item = document.createElement('div');
                item.className = 'skeleton-item';
                grid.appendChild(item);
            }
        }

        function showSkeleton() {
            document.getElementById('skeletonArea').style.display = '';
            hideStatus();
        }

        function hideSkeleton() {
            document.getElementById('skeletonArea').style.display = 'none';
        }

        // ==================== Loading ====================
        async function load() {
            showSkeleton();
            document.getElementById('mainContainer').style.display = 'block';
            try {
                const res = await fetch('/api/dates');
                const data = await res.json();
                if (!data.dates || data.dates.length === 0) {
                    hideSkeleton();
                    showStatus('empty', '还没有照片或视频', '把文件放到媒体文件夹后刷新页面即可', '');
                    return;
                }
                // Parallel loading of all dates
                const promises = data.dates.map(async (date) => {
                    const files = [];
                    let p = 1, hasMore = true;
                    while (hasMore) {
                        const r = await fetch('/api/files/' + date + '?page=' + p);
                        const d = await r.json();
                        d.files.forEach(f => files.push({ ...f, date }));
                        hasMore = p < d.pages;
                        p++;
                    }
                    return files;
                });
                const nested = await Promise.all(promises);
                state.allMedia = nested.flat();
                filterMedia();
                hideSkeleton();
                if (state.filteredMedia.length === 0) {
                    showStatus('empty', '没有匹配的内容', '试试切换筛选条件', '');
                } else {
                    render();
                }
            } catch (e) {
                console.error('Load error:', e);
                hideSkeleton();
                showStatus('error', '加载失败', '无法连接服务器，请检查网络后重试', '重新加载');
                document.getElementById('statusBtn').onclick = load;
            }
        }

        // ==================== Filter ====================
        function filterMedia() {
            const f = state.currentFilter;
            if (f === 'all') state.filteredMedia = state.allMedia;
            else if (f === 'photo') state.filteredMedia = state.allMedia.filter(m => !m.isVideo);
            else state.filteredMedia = state.allMedia.filter(m => m.isVideo);
            if (state.selectMode) {
                state.selectedFiles.clear();
                updateActionButtons();
            }
        }

        // ==================== Render with Event Delegation ====================
        function render() {
            let html = '', currentDate = '';
            state.filteredMedia.forEach((item, i) => {
                if (item.date !== currentDate) {
                    if (currentDate) html += '</div></div>';
                    currentDate = item.date;
                    let dateHtml = '<div class="date-section"><div class="date-header">' + currentDate;
                    if (state.selectMode) {
                        dateHtml += '<span class="select-hint">点击选择 | 已选 ' + state.selectedFiles.size + ' 个</span>';
                    }
                    dateHtml += '</div><div class="photo-grid">';
                    html += dateHtml;
                }
                const encodedPath = encodeURIComponent(item.path);
                const sel = state.selectedFiles.has(item.path) ? ' selected' : '';
                if (item.isVideo) {
                    html += '<div class="photo-item' + sel + '" data-index="' + i + '" data-path="' + encodedPath + '">';
                    html += '<img src="/thumb/' + encodedPath + '" loading="lazy" alt="">';
                    html += '<div class="video-overlay"><div class="play-indicator"></div></div></div>';
                } else {
                    html += '<div class="photo-item' + sel + '" data-index="' + i + '" data-path="' + encodedPath + '"><img src="/thumb/' + encodedPath + '" loading="lazy" alt=""></div>';
                }
            });
            if (currentDate) html += '</div></div>';
            document.getElementById('content').innerHTML = html;
            updateActionButtons();
        }

        // ==================== Event Delegation ====================
        document.getElementById('content').addEventListener('click', (e) => {
            const item = e.target.closest('.photo-item');
            if (!item) return;
            const index = parseInt(item.dataset.index);
            if (state.selectMode) {
                const path = decodeURIComponent(item.dataset.path);
                if (state.selectedFiles.has(path)) {
                    state.selectedFiles.delete(path);
                    item.classList.remove('selected');
                } else {
                    state.selectedFiles.add(path);
                    item.classList.add('selected');
                }
                updateActionButtons();
                // Update select-hint counters
                document.querySelectorAll('.select-hint').forEach(el => {
                    el.textContent = '点击选择 | 已选 ' + state.selectedFiles.size + ' 个';
                });
            } else {
                state.currentIndex = index;
                openLightbox();
            }
        });

        // ==================== Select Mode ====================
        function toggleSelectMode() {
            state.selectMode = !state.selectMode;
            if (!state.selectMode) state.selectedFiles.clear();
            render();
        }

        function updateActionButtons() {
            const sm = document.getElementById('selectModeBtn');
            const sa = document.getElementById('selectAllBtn');
            const db = document.getElementById('deleteBtn');
            if (state.selectMode) {
                sm.textContent = '取消';
                sm.classList.add('active');
                sa.style.display = '';
                db.style.display = '';
                db.textContent = state.selectedFiles.size > 0 ? '🗑️ 删除 (' + state.selectedFiles.size + ')' : '🗑️ 删除';
                db.style.opacity = state.selectedFiles.size > 0 ? '1' : '0.5';
            } else {
                sm.textContent = '选择';
                sm.classList.remove('active');
                sa.style.display = 'none';
                db.style.display = 'none';
            }
        }

        function selectAll() {
            if (state.selectedFiles.size === state.filteredMedia.length) {
                state.selectedFiles.clear();
            } else {
                state.selectedFiles.clear();
                state.filteredMedia.forEach(item => state.selectedFiles.add(item.path));
            }
            render();
        }

        async function deleteSelected() {
            if (state.selectedFiles.size === 0) return;
            const ok = await showConfirm({
                title: '确认删除',
                message: '确定要删除选中的 ' + state.selectedFiles.size + ' 个文件吗？',
                confirmText: '删除',
                danger: true,
                icon: '⚠️'
            });
            if (!ok) return;
            try {
                const filesToDelete = Array.from(state.selectedFiles);
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: filesToDelete })
                });
                const data = await response.json();
                if (data.deleted > 0) {
                    showToast('成功删除 ' + data.deleted + ' 个文件', 'success');
                } else if (data.failed > 0) {
                    showToast(data.failed + ' 个文件删除失败', 'error');
                } else {
                    showToast('没有文件被删除', 'error');
                }
                state.allMedia = [];
                state.selectedFiles.clear();
                state.selectMode = false;
                await load();
            } catch (e) {
                console.error('Delete error:', e);
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        // ==================== Lightbox ====================
        function openLightbox() {
            const item = state.filteredMedia[state.currentIndex];
            const encodedPath = encodeURIComponent(item.path);
            const container = document.getElementById('lightboxContent');
            container.innerHTML = '';
            document.getElementById('lightboxCounter').textContent = (state.currentIndex + 1) + ' / ' + state.filteredMedia.length;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
            state.currentScale = 1;
            state.translateX = 0;
            state.translateY = 0;
            state.isZoomed = false;

            if (item.isVideo) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000;';
                video.innerHTML = '<source src="/api/file/' + encodedPath + '" type="video/mp4">';
                video.onerror = () => {
                    container.innerHTML = '<div class="video-error">无法播放此视频<br><button onclick="navigate(1)">下一个</button></div>';
                };
                container.appendChild(video);
                video.onloadeddata = () => { video.muted = false; video.play().catch(() => {}); };
            } else {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;';
                const img = document.createElement('img');
                img.src = '/api/file/' + encodedPath;
                img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;transition:transform 0.2s ease;user-select:none;-webkit-user-select:none;';
                img.draggable = false;
                img.onerror = () => {
                    wrapper.innerHTML = '<div class="video-error" style="color:#fff;">无法加载此图片<br><small>文件可能已损坏或过大</small><br><button onclick="navigate(1)">下一个</button></div>';
                };

                // ========== Click/Double-click to zoom ==========
                let lastClickTime = 0;
                img.addEventListener('click', (e) => {
                    const now = Date.now();
                    if (now - lastClickTime < 350) { return; } // ignore if double-click coming
                    lastClickTime = now;
                    if (state.isZoomed) {
                        state.currentScale = 1;
                        state.translateX = 0;
                        state.translateY = 0;
                        state.isZoomed = false;
                        applyTransform(img);
                        img.style.cursor = 'zoom-in';
                    } else {
                        state.currentScale = 2.5;
                        state.translateX = 0;
                        state.translateY = 0;
                        state.isZoomed = true;
                        applyTransform(img);
                        img.style.cursor = 'grab';
                    }
                });

                // Double-click to reset
                img.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    state.currentScale = 1;
                    state.translateX = 0;
                    state.translateY = 0;
                    state.isZoomed = false;
                    applyTransform(img);
                    img.style.cursor = 'zoom-in';
                });

                // ========== Pinch Zoom ==========
                let pinchDistance = 0;

                // ========== Pan / Drag ==========
                let dragStartX = 0, dragStartY = 0;
                let dragStartTX = 0, dragStartTY = 0;
                let isDragging = false;
                let pointerId = null;

                function onPointerDown(e) {
                    if (e.target !== img && !img.contains(e.target)) return;
                    if (e.pointerType === 'touch' && state.pinchInProgress) return;
                    if (!state.isZoomed && e.pointerType !== 'touch') {
                        // Desktop click when not zoomed: handled by click event
                        return;
                    }
                    e.preventDefault();
                    img.setPointerCapture(e.pointerId);
                    pointerId = e.pointerId;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    dragStartTX = state.translateX;
                    dragStartTY = state.translateY;
                    isDragging = state.isZoomed;
                    if (isDragging) img.style.cursor = 'grabbing';
                }

                function onPointerMove(e) {
                    if (!isDragging || e.pointerId !== pointerId) return;
                    e.preventDefault();
                    state.translateX = dragStartTX + (e.clientX - dragStartX);
                    state.translateY = dragStartTY + (e.clientY - dragStartY);
                    applyTransform(img);
                }

                function onPointerUp(e) {
                    if (e.pointerId !== pointerId) return;
                    img.releasePointerCapture(e.pointerId);
                    pointerId = null;
                    if (isDragging && state.isZoomed) {
                        img.style.cursor = 'grab';
                    }
                    isDragging = false;
                }

                // Only enable pan when zoomed - use different handling
                img.addEventListener('pointerdown', onPointerDown);
                img.addEventListener('pointermove', onPointerMove);
                img.addEventListener('pointerup', onPointerUp);
                img.addEventListener('pointercancel', onPointerUp);

                // ========== Pinch (touch only) ==========
                let pinchStartScale = 1;
                let pinchStartTranslateX = 0;
                let pinchStartTranslateY = 0;
                state.pinchInProgress = false;

                wrapper.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        state.pinchInProgress = true;
                        const t1 = e.touches[0], t2 = e.touches[1];
                        pinchDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        pinchStartScale = state.currentScale;
                        pinchStartTranslateX = state.translateX;
                        pinchStartTranslateY = state.translateY;
                    }
                }, { passive: false });

                wrapper.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && state.pinchInProgress) {
                        e.preventDefault();
                        const t1 = e.touches[0], t2 = e.touches[1];
                        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        const ratio = dist / pinchDistance;
                        state.currentScale = Math.max(0.5, Math.min(pinchStartScale * ratio, 6));
                        // Center the zoom on the pinch midpoint
                        const cx = (t1.clientX + t2.clientX) / 2;
                        const cy = (t1.clientY + t2.clientY) / 2;
                        state.isZoomed = state.currentScale > 1;
                        applyTransform(img);
                        if (state.isZoomed) {
                            img.style.cursor = 'grab';
                        } else {
                            img.style.cursor = 'zoom-in';
                        }
                    }
                }, { passive: false });

                wrapper.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2 && state.pinchInProgress) {
                        state.pinchInProgress = false;
                        if (state.currentScale < 1) {
                            state.currentScale = 1;
                            state.translateX = 0;
                            state.translateY = 0;
                            state.isZoomed = false;
                            applyTransform(img);
                            img.style.cursor = 'zoom-in';
                        }
                    }
                }, { passive: true });

                wrapper.appendChild(img);
                container.appendChild(wrapper);
            }
        }

        function applyTransform(el) {
            el.style.transform = 'translate(' + state.translateX + 'px, ' + state.translateY + 'px) scale(' + state.currentScale + ')';
        }

        function closeLightbox() {
            const video = document.querySelector('#lightboxContent video');
            if (video) video.pause();
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigate(delta) {
            const video = document.querySelector('#lightboxContent video');
            if (video) video.pause();
            state.currentIndex = (state.currentIndex + delta + state.filteredMedia.length) % state.filteredMedia.length;
            openLightbox();
        }

        // ==================== Lightbox Event Delegation ====================
        document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
        document.getElementById('navPrev').addEventListener('click', () => navigate(-1));
        document.getElementById('navNext').addEventListener('click', () => navigate(1));

        document.getElementById('lightboxDeleteBtn').addEventListener('click', async () => {
            const currentItem = state.filteredMedia[state.currentIndex];
            if (!currentItem) return;
            const ok = await showConfirm({
                title: '确认删除',
                message: '确定要删除这张图片吗？',
                path: currentItem.path,
                confirmText: '删除',
                danger: true,
                icon: '⚠️'
            });
            if (!ok) return;
            try {
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: [currentItem.path] })
                });
                const data = await response.json();
                if (data.deleted > 0) {
                    showToast('删除成功', 'success');
                    const idx = state.allMedia.findIndex(m => m.path === currentItem.path);
                    if (idx > -1) state.allMedia.splice(idx, 1);
                    filterMedia();
                    closeLightbox();
                    if (state.filteredMedia.length > 0) {
                        state.currentIndex = Math.min(state.currentIndex, state.filteredMedia.length - 1);
                        openLightbox();
                    } else {
                        // After deletion, we need to re-check all dates
                        // Instead of re-calling load() which may miss the delete on server side
                        // just re-render with empty state
                        if (state.allMedia.length === 0) {
                            render();
                            showStatus('empty', '没有照片或视频了', '把所有文件都删光了', '');
                        } else {
                            render();
                        }
                    }
                } else {
                    showAlert({ title: '删除失败', message: '请重试', icon: '❌' });
                }
            } catch (e) {
                console.error('Delete error:', e);
                showAlert({ title: '删除失败', message: e.message, icon: '❌' });
            }
        });

        // Click background to close
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === document.getElementById('lightbox')) closeLightbox();
        });

        // ==================== Keyboard ====================
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
        });

        // Mouse wheel in lightbox
        window.addEventListener('wheel', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            e.preventDefault();
            navigate(e.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        // Swipe for lightbox
        let lbTouchStartX = 0, lbTouchStartY = 0, lbTouchTime = 0, lbIgnoreSwipe = false;
        document.addEventListener('touchstart', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            lbTouchStartX = e.touches[0].clientX;
            lbTouchStartY = e.touches[0].clientY;
            lbTouchTime = Date.now();
            const ww = window.innerWidth;
            lbIgnoreSwipe = lbTouchStartX < 70 || lbTouchStartX > ww - 70;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (lbIgnoreSwipe) return;
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const dt = Date.now() - lbTouchTime;
            const dx = lbTouchStartX - endX;
            const dy = lbTouchStartY - endY;
            if (dt > 350) return;
            if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
                navigate(dx > 0 ? 1 : -1);
            } else if (Math.abs(dy) > 80) {
                navigate(dy > 0 ? 1 : -1);
            }
        }, { passive: false });

        // ==================== Filter Buttons ====================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.currentFilter = btn.dataset.filter;
                filterMedia();
                state.currentIndex = 0;
                if (state.filteredMedia.length > 0) {
                    hideStatus();
                    render();
                } else {
                    document.getElementById('content').innerHTML = '';
                    showStatus('empty', '没有匹配的内容', '试试切换筛选条件', '');
                }
                updateActionButtons();
            });
        });

        // ==================== Buttons ====================
        document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
        document.getElementById('selectAllBtn').addEventListener('click', selectAll);
        document.getElementById('deleteBtn').addEventListener('click', deleteSelected);

        // ==================== PWA Install ====================
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const banner = document.getElementById('installBanner');
            if (!localStorage.getItem('installDismissed')) {
                banner.classList.add('show');
            }
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            document.getElementById('installBanner').classList.remove('show');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') console.log('用户接受了安装');
                deferredPrompt = null;
            }
        });

        document.getElementById('installClose').addEventListener('click', () => {
            document.getElementById('installBanner').classList.remove('show');
            localStorage.setItem('installDismissed', 'true');
        });

        // ==================== Init ====================
        generateSkeleton();
        load();

    </script>
</body>
</html>
